# TopCam — Docker Compose (laboratório: uma VM Debian).
# Uso:  cp .env.example .env  (ou scripts/generate-env.sh)  →  docker compose up -d --build
# Serviços isolados por responsabilidade para permitir a migração para o servidor
# dedicado mudando apenas variáveis de ambiente, volumes e escala.

name: topcam

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    target: runtime
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
  image: topcam/app:${TOPCAM_VERSION:-0.1.0}
  restart: unless-stopped
  logging: *logging
  environment: &app-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://topcam_app:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}@postgres:5432/topcam
    REDIS_URL: redis://redis:6379/0
    MEDIAMTX_API_URL: http://mediamtx:9997
    MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
    MEDIA_HOOK_SECRET: ${MEDIA_HOOK_SECRET:?defina MEDIA_HOOK_SECRET}
    MEDIA_READ_USER: topcam-internal
    MEDIA_READ_PASSWORD: ${MEDIA_READ_PASSWORD:?defina MEDIA_READ_PASSWORD}
    MEDIA_GATEWAY_TOKEN: ${MEDIA_GATEWAY_TOKEN:?defina MEDIA_GATEWAY_TOKEN (scripts/generate-env.sh --add-missing)}
    STREAM_KEY_ENC_KEY: ${STREAM_KEY_ENC_KEY:?defina STREAM_KEY_ENC_KEY}
    PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    RTMP_PUBLIC_PORT: ${RTMP_PUBLIC_PORT:-1935}
    RECORDINGS_PATH: /recordings
    JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (scripts/generate-env.sh --add-missing)}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # Endereço do painel nos e-mails (alertas e dados de acesso).
    PANEL_URL: ${PANEL_URL:-http://${PUBLIC_HOST:-localhost}}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: topcam
      POSTGRES_USER: topcam_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topcam_owner -d topcam"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica migrations e o seed idempotente; termina em seguida.
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "packages/db/dist/cli.js", "setup"]
    environment:
      MIGRATION_DATABASE_URL: postgres://topcam_owner:${POSTGRES_PASSWORD}@postgres:5432/topcam
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      STREAM_KEY_ENC_KEY: ${STREAM_KEY_ENC_KEY}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      MEDIAMTX_API_URL: http://mediamtx:9997
      RECORDINGS_PATH: /recordings
      VIDEO_QUOTA_BYTES: ${VIDEO_QUOTA_BYTES:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      <<: *app-env
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-5}
      OFFLINE_AFTER_S: ${OFFLINE_AFTER_S:-10}
    volumes:
      - ${RECORDINGS_DIR:-./.data/recordings}:/recordings
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # O worker grava um heartbeat a cada ciclo do poller.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Prepara a pasta de gravações: dono = usuário 1000, o mesmo do MediaMTX (que
  # grava) e do worker (que confere e apaga pela retenção). Roda a cada subida.
  storage-init:
    # Mesma imagem da aplicação (construída pelos serviços api/worker); não constrói de novo.
    image: topcam/app:${TOPCAM_VERSION:-0.1.0}
    pull_policy: never
    logging: *logging
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /recordings/cam && chown -R 1000:1000 /recordings && chmod 0750 /recordings
    volumes:
      - ${RECORDINGS_DIR:-./.data/recordings}:/recordings

  mediamtx:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    restart: unless-stopped
    logging: *logging
    # Sem root: grava os arquivos como o usuário 1000 (o worker precisa apagá-los).
    user: "1000:1000"
    environment:
      MTX_AUTHHTTPADDRESS: http://api:3000/internal/mediamtx/auth?secret=${MEDIA_HOOK_SECRET}
      # Endereço anunciado aos navegadores para a mídia WebRTC (porta 8189).
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_HOST:-localhost}
      MEDIA_HOOK_SECRET: ${MEDIA_HOOK_SECRET}
      TOPCAM_API_URL: http://api:3000
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./infra/mediamtx/hooks:/hooks:ro
      - ${RECORDINGS_DIR:-./.data/recordings}:/recordings
    ports:
      - "${RTMP_BIND:-0.0.0.0}:${RTMP_PUBLIC_PORT:-1935}:1935"
      # Mídia WebRTC do ao vivo. A porta externa precisa ser igual à interna (8189),
      # pois é a anunciada ao navegador.
      - "${WEBRTC_BIND:-0.0.0.0}:8189:8189/udp"
      - "${WEBRTC_BIND:-0.0.0.0}:8189:8189/tcp"
    depends_on:
      api:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Painel administrativo (Next.js). Acessado pelo gateway.
  web:
    build:
      context: .
      target: web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: topcam/web:${TOPCAM_VERSION:-0.1.0}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    # Pasta montada (não o arquivo) + --watch: o Caddy recarrega sozinho quando o
    # Caddyfile muda, inclusive depois de um git pull.
    command:
      ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    environment:
      # Valida /live/<token>/... na API (rota interna protegida pelo segredo dos hooks).
      MEDIA_HOOK_SECRET: ${MEDIA_HOOK_SECRET}
      # Token do gateway para ler cam/<id> no MediaMTX (HLS/WHEP).
      MEDIA_GATEWAY_TOKEN: ${MEDIA_GATEWAY_TOKEN:?defina MEDIA_GATEWAY_TOKEN (scripts/generate-env.sh --add-missing)}
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - caddydata:/data
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------ métricas (Fase 7)
  # Prometheus: 7 dias de métricas da VM e do servidor de mídia. Sem porta publicada.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_MAX_SIZE:-2GB}
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 10

  # CPU, memória, discos, rede e pressão de IO da VM (lidos do /proc e /sys do host).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.pressure
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *logging

  # Caixa de e-mail de teste (perfil "test"): o aceite da Fase 7 envia os alertas para
  # ela em vez do Gmail. Interface só na rede interna.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["test"]
    logging: *logging

  # ------------------------------------------------------------ perfil "test"
  # Transmissor RTMP de teste (simula câmeras). Ex.:
  #   docker compose --profile test run -d --rm test-transmitter publish <CHAVE> CAM-001
  test-transmitter:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    profiles: ["test"]
    init: true
    entrypoint: ["/bin/sh", "/tools/transmit.sh"]
    environment:
      TX_URL: ${TX_URL:-rtmp://mediamtx:1935/live}
      TX_SIZE: ${TX_SIZE:-640x360}
      TX_FPS: ${TX_FPS:-15}
      TX_BITRATE: ${TX_BITRATE:-800k}
      TX_CLOCK: ${TX_CLOCK:-0}
    volumes:
      - ./tools/test-transmitter:/tools:ro
    logging: *logging

  # Testes automatizados (unitários + integração) contra o Postgres/Redis do Compose.
  tests:
    build:
      context: .
      target: test
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: topcam/tests:${TOPCAM_VERSION:-0.1.0}
    profiles: ["test"]
    environment:
      TEST_ADMIN_DATABASE_URL: postgres://topcam_owner:${POSTGRES_PASSWORD}@postgres:5432/postgres
      TEST_REDIS_URL: redis://redis:6379/15
      # Mesma senha do ambiente: os testes recriam bancos temporários, mas o papel topcam_app é do cluster.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  prometheusdata:
  redisdata:
  caddydata:
