# TopCam — Prometheus (Fase 7): métricas de 7 dias, só na rede interna (sem porta publicada).
#   - node-exporter: CPU, memória, discos, rede e pressão de IO da VM
#   - mediamtx: métricas do servidor de mídia (caminhos, leitores, bytes)
#   - o próprio Prometheus
# Consulta pela VM:  docker compose exec prometheus wget -qO- 'http://localhost:9090/api/v1/query?query=up'
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: mediamtx
    metrics_path: /metrics
    static_configs:
      - targets: ["mediamtx:9998"]
