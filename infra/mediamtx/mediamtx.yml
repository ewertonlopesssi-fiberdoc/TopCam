# TopCam — configuração do MediaMTX (servidor de mídia).
#
# - Toda publicação e leitura é autorizada pela API (authMethod: http).
#   O endereço com o segredo vem da variável MTX_AUTHHTTPADDRESS (compose.yaml).
# - API de controle (9997), métricas (9998), RTSP (8554), HLS (8888) e a
#   sinalização WebRTC (8889) ficam só na rede interna dos contêineres. São
#   publicadas apenas a porta RTMP (câmeras) e a 8189 (mídia WebRTC, UDP/TCP).
# - Ao vivo: o navegador acessa /live/<token>/... no gateway; o gateway valida o
#   token na API e só então encaminha para cam/<id> aqui (HLS ou WHEP), com o
#   token interno do gateway (Bearer), que só permite ler caminhos cam/<id>.
# - Caminhos:
#     live/<chave>  → entrada: a câmera publica aqui; usa "all_others" com os
#                     padrões abaixo (nunca grava). A API decide quem publica.
#     cam/<id>      → relay interno de live/<chave> (sem transcodificar), criado
#                     pelo worker via API a partir do banco; usado para gravação
#                     (Fase 4) e visualização (Fase 3).
# - Gravação desligada por padrão; só é ligada, câmera a câmera, pelo worker.

logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s

authMethod: http
authHTTPAddress: http://api:3000/internal/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: true
apiAddress: :9997
metrics: true
metricsAddress: :9998
pprof: false

# Reprodução de gravações: Fase 5.
playback: false

# RTSP somente interno (validação do stream pelo worker).
rtsp: true
rtspTransports: [tcp]
rtspAddress: :8554

# Entrada das câmeras. RTMPS (1936) será habilitado na Fase 8 com o certificado do domínio.
rtmp: true
rtmpEncryption: "no"
rtmpAddress: :1935

# HLS interno (Low-Latency HLS); acesso público só via gateway com token temporário.
hls: true
hlsAddress: :8888
hlsAllowOrigins: []
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
# Libera o muxer 30 s depois do último espectador (câmeras só ao vivo voltam a não ler nada).
hlsMuxerCloseAfter: 30s

# WebRTC (WHEP): sinalização interna (8889) via gateway; mídia direto na porta 8189
# (UDP, com TCP como alternativa). O endereço anunciado ao navegador vem de
# MTX_WEBRTCADDITIONALHOSTS (= PUBLIC_HOST) no compose.yaml.
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Só o endereço público (PUBLIC_HOST) é anunciado; IPs internos dos contêineres não.
webrtcIPsFromInterfaces: false
webrtcHandshakeTimeout: 10s
srt: false
moq: false

pathDefaults:
  source: publisher
  # Segunda publicação na mesma chave é recusada (a API também registra o evento).
  overridePublisher: false
  record: false
  # Só caminhos cam/<id da câmera> gravam: o diretório nunca contém a chave.
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s
  # Retenção é controlada pelo worker a partir do índice no PostgreSQL (Fase 4).
  recordDeleteAfter: 0s
  runOnOnline: /bin/sh /hooks/notify.sh online
  runOnOffline: /bin/sh /hooks/notify.sh offline

paths:
  all_others:
